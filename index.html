<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>从课堂到真实商业｜网页演讲版</title>
  <meta name="description" content="陈天翔校友设计分享网页演讲版。">
  <link rel="stylesheet" href="keynote-web-v1.css?v=20260601-qr-normalized">
</head>
<body>
  <header class="deck-bar">
    <a class="brand" href="#slide-1" aria-label="回到封面">
      <img src="assets/site/brand/logo-light.png" alt="方法想象">
    </a>
    <nav class="chapters" aria-label="章节导航">
      <a href="#slide-1">开场</a>
      <a href="#slide-13">断裂</a>
      <a href="#slide-22">模型</a>
      <a href="#slide-31">五福</a>
      <a href="#slide-62">砀山</a>
      <a href="#slide-83">SmartFIT</a>
      <a href="#slide-99">AI</a>
      <a href="#slide-107">落点</a>
    </nav>
    <div class="bar-actions">
      <button type="button" data-notes-toggle>备注</button>
      <button type="button" data-overview-toggle>总览</button>
    </div>
  </header>

  <main id="deck" class="deck" aria-live="polite"></main>

  <aside class="speaker-notes" data-notes-panel aria-label="口播备注">
    <div class="notes-head">
      <span>口播提示</span>
      <button type="button" data-notes-close aria-label="关闭备注">×</button>
    </div>
    <div data-notes-content></div>
  </aside>

  <div class="slide-progress" aria-hidden="true">
    <span data-progress-bar></span>
  </div>

  <div class="hint">← / → 翻页 · N 备注 · O 总览</div>

  <script src="keynote-web-v1.js?v=20260601-qr-normalized"></script>
</body>
</html>
